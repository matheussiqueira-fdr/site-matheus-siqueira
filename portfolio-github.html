<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfólio GitHub | Matheus Siqueira</title>
<meta name="description" content="Repositórios públicos de Matheus Siqueira no GitHub, carregados ao vivo pela API do GitHub.">
<style>
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --text: #1d2630;
    --muted: #5d6b78;
    --line: #dde3ea;
    --accent: #2b6f77;
    --accent-soft: #e4f1f2;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12171c;
      --card: #1a2128;
      --text: #e6ebf0;
      --muted: #9aa7b4;
      --line: #2a343e;
      --accent: #6cc2cb;
      --accent-soft: #1f3337;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12171c;
    --card: #1a2128;
    --text: #e6ebf0;
    --muted: #9aa7b4;
    --line: #2a343e;
    --accent: #6cc2cb;
    --accent-soft: #1f3337;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.5;
  }
  main {
    max-width: 960px;
    margin: 0 auto;
    padding: 40px 16px 64px;
  }
  header h1 {
    margin: 0 0 4px;
    font-size: clamp(1.6rem, 4vw, 2.2rem);
  }
  header p { margin: 0; color: var(--muted); }
  .profile-link {
    display: inline-block;
    margin-top: 14px;
    color: var(--accent);
    font-weight: 600;
    text-decoration: none;
  }
  .profile-link:hover { text-decoration: underline; }
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    justify-content: space-between;
    margin: 28px 0 16px;
  }
  .count { color: var(--muted); font-size: 0.95rem; }
  input[type="search"] {
    flex: 1 1 220px;
    max-width: 320px;
    padding: 9px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--card);
    color: var(--text);
    font: inherit;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 14px;
  }
  .repo {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 18px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    text-decoration: none;
    color: inherit;
    transition: border-color 0.15s, transform 0.15s;
  }
  .repo:hover, .repo:focus-visible {
    border-color: var(--accent);
    transform: translateY(-2px);
    outline: none;
  }
  .repo h2 {
    margin: 0;
    font-size: 1.05rem;
    overflow-wrap: anywhere;
  }
  .repo p {
    margin: 0;
    color: var(--muted);
    font-size: 0.93rem;
    flex: 1;
  }
  .meta {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    font-size: 0.82rem;
    color: var(--muted);
  }
  .lang {
    padding: 2px 8px;
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--accent);
    font-weight: 600;
  }
  .state {
    padding: 24px;
    border: 1px dashed var(--line);
    border-radius: 12px;
    color: var(--muted);
    text-align: center;
  }
  footer {
    margin-top: 40px;
    color: var(--muted);
    font-size: 0.88rem;
  }
  @media (max-width: 480px) {
    main { padding: 28px 16px 48px; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>Portfólio GitHub</h1>
    <p>Matheus Siqueira · Projetos públicos, carregados ao vivo a partir do GitHub</p>
    <a class="profile-link" href="https://github.com/matheussiqueira-fdr" target="_blank" rel="noopener">Ver perfil completo no GitHub →</a>
  </header>

  <div class="toolbar">
    <span class="count" id="count">Carregando repositórios…</span>
    <input type="search" id="filter" placeholder="Filtrar por nome, descrição ou linguagem" aria-label="Filtrar repositórios" disabled>
  </div>

  <section class="grid" id="repos" aria-live="polite"></section>

  <footer>
    Esta página não tem lista fixa: os repositórios, descrições e linguagens vêm da API pública do GitHub a cada visita.
  </footer>
</main>

<script>
  const USER = "matheussiqueira-fdr";
  const API = `https://api.github.com/users/${USER}/repos?per_page=100&sort=updated&type=owner`;

  const list = document.getElementById("repos");
  const count = document.getElementById("count");
  const filter = document.getElementById("filter");
  let repos = [];

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined && text !== null) node.textContent = text;
    return node;
  }

  function formatDate(iso) {
    return new Date(iso).toLocaleDateString("pt-BR", { month: "short", year: "numeric" });
  }

  function render() {
    const q = filter.value.trim().toLowerCase();
    const visible = repos.filter(r => {
      if (!q) return true;
      return [r.name, r.description, r.language]
        .filter(Boolean)
        .some(v => v.toLowerCase().includes(q));
    });

    list.replaceChildren();

    if (visible.length === 0) {
      list.append(el("div", "state", q ? "Nenhum repositório encontrado para este filtro." : "Nenhum repositório público por aqui ainda."));
    }

    for (const r of visible) {
      const card = el("a", "repo");
      card.href = r.html_url;
      card.target = "_blank";
      card.rel = "noopener";

      card.append(el("h2", null, r.name));
      card.append(el("p", null, r.description || "Sem descrição no GitHub."));

      const meta = el("div", "meta");
      if (r.language) meta.append(el("span", "lang", r.language));
      if (r.stargazers_count > 0) meta.append(el("span", null, `★ ${r.stargazers_count}`));
      meta.append(el("span", null, `Atualizado em ${formatDate(r.updated_at)}`));
      card.append(meta);

      list.append(card);
    }

    const total = repos.length;
    count.textContent = q
      ? `${visible.length} de ${total} repositórios`
      : `${total} repositórios públicos`;
  }

  async function load() {
    try {
      const response = await fetch(API, { headers: { Accept: "application/vnd.github+json" } });
      if (!response.ok) throw new Error(`GitHub respondeu ${response.status}`);
      const data = await response.json();
      repos = data.filter(r => !r.fork && !r.private);
      repos.sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at));
      filter.disabled = false;
      render();
    } catch (err) {
      count.textContent = "Não foi possível carregar os repositórios.";
      list.replaceChildren(el("div", "state", "Veja a lista diretamente no perfil do GitHub enquanto isso."));
    }
  }

  filter.addEventListener("input", render);
  load();
</script>
</body>
</html>
